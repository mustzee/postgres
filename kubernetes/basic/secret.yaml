apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: postgres
type: Opaque
stringData:
  # Base64 인코딩 필요 없음 (stringData 사용)
  postgres-password: "YourSecurePassword123!"
  replication-password: "ReplicationPass123!"

---
# 프로덕션에서는 명령어로 Secret 생성 권장:
# kubectl create secret generic postgres-secret \
#   --from-literal=postgres-password=YourSecurePassword123! \
#   --from-literal=replication-password=ReplicationPass123! \
#   -n postgres

# 또는 외부 Secret 관리 도구 사용:
# - Sealed Secrets
# - External Secrets Operator
# - Vault
# - AWS Secrets Manager / GCP Secret Manager
