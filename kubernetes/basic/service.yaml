apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: postgres
  labels:
    app: postgres
spec:
  type: ClusterIP  # 클러스터 내부에서만 접근
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app: postgres
  clusterIP: None  # Headless Service (StatefulSet과 함께 사용)

---
# LoadBalancer Service (외부 접근 필요 시)
# 주의: 프로덕션에서는 보안 위험!
apiVersion: v1
kind: Service
metadata:
  name: postgres-external
  namespace: postgres
  labels:
    app: postgres
spec:
  type: LoadBalancer
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app: postgres

---
# NodePort Service (개발 환경)
apiVersion: v1
kind: Service
metadata:
  name: postgres-nodeport
  namespace: postgres
  labels:
    app: postgres
spec:
  type: NodePort
  ports:
  - port: 5432
    targetPort: 5432
    nodePort: 30432  # 30000-32767 범위
    protocol: TCP
    name: postgres
  selector:
    app: postgres
